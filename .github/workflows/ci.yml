name: ci

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
      - name: Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Sync package tests
        working-directory: packages/zhuaji_sync
        run: dart test
      - name: API tests
        working-directory: server
        run: dart test
